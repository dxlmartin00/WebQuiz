name: Feature Readiness & Build Check

on:
  push:
    branches: [ main, testing ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Verify Types & Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/webquiz"
      NEXTAUTH_SECRET: "ci-dummy-secret-key-32-chars-long!"
      NEXTAUTH_URL: "http://localhost:3000"
      ADMIN_EMAIL: "admin@example.com"
      GOOGLE_CLIENT_ID: "dummy-client-id"
      GOOGLE_CLIENT_SECRET: "dummy-client-secret"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Build Next.js Production Bundle
        run: npm run build
